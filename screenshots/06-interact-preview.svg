<svg xmlns="http://www.w3.org/2000/svg" width="847" height="1405" viewBox="0 0 847 1405" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13.5">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="847" height="1405" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="847" height="1405" fill="#0d1117"/>
    <rect width="847" height="34" fill="#161b22"/>
    <line x1="0" y1="34" x2="847" y2="34" stroke="#30363d"/>
    <circle cx="19" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="39" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="59" cy="17" r="6" fill="#27c93f"/>
    <text x="424" y="21" fill="#8b949e" text-anchor="middle" font-size="12">npm run interact -- --network preview</text>
    <text x="18" y="62" fill="#3fb950">$ npm run interact -- --network preview</text>
    <text x="18" y="82" fill="#c9d1d9"> </text>
    <text x="18" y="103" fill="#79c0ff">╔══════════════════════════════════════════════════════════════╗</text>
    <text x="18" y="124" fill="#c9d1d9">║  UmbraPay — interact with the deployed contract</text>
    <text x="18" y="145" fill="#79c0ff">╚══════════════════════════════════════════════════════════════╝</text>
    <text x="18" y="166" fill="#c9d1d9">  Network:           preview</text>
    <text x="18" y="187" fill="#d2a8ff">  Contract address:  8c1765ec101c02e4d4a024c7416185f9d619fcc296aebaf55b436159aed57a5c</text>
    <text x="18" y="208" fill="#c9d1d9">  Deployed:          2026-09-22T09:34:21.564Z</text>
    <text x="18" y="229" fill="#c9d1d9">  Deployed by:       mn_addr_preview1y73mmfdus9dn3c7c0wkf4nm79qed5zdvj4nuhpzhrg4zxpvxvn2q9ffrny</text>
    <text x="18" y="250" fill="#c9d1d9">─── Wallet setup ───────────────────────────────────────────────</text>
    <text x="18" y="271" fill="#c9d1d9">  Creating wallet...</text>
    <text x="18" y="292" fill="#c9d1d9">  Restored 3/3 child wallets from saved state — sync will resume.</text>
    <text x="18" y="313" fill="#c9d1d9">  Syncing with network...</text>
    <text x="18" y="334" fill="#c9d1d9">  ℹ  RPC disconnection messages during sync are normal and can be safely ignored.</text>
    <text x="18" y="354" fill="#3fb950">  ✓ Synced with network.                                      </text>
    <text x="18" y="375" fill="#c9d1d9">  Wallet Address: mn_addr_preview1y73mmfdus9dn3c7c0wkf4nm79qed5zdvj4nuhpzhrg4zxpvxvn2q9ffrny</text>
    <text x="18" y="396" fill="#c9d1d9">  Balance: 5,000,000,000 tNight</text>
    <text x="18" y="417" fill="#c9d1d9">  Checking proof server...</text>
    <text x="18" y="438" fill="#c9d1d9">  Proof server ready!                                 </text>
    <text x="18" y="459" fill="#c9d1d9">─── DUST ───────────────────────────────────────────────────────</text>
    <text x="18" y="480" fill="#c9d1d9">  DUST tokens ready!</text>
    <text x="18" y="501" fill="#c9d1d9">─── Public ledger BEFORE ───────────────────────────────────────</text>
    <text x="18" y="522" fill="#c9d1d9">  payrollFloor          1,000</text>
    <text x="18" y="543" fill="#c9d1d9">  payrollRound          1</text>
    <text x="18" y="564" fill="#c9d1d9">  totalDisbursed        0</text>
    <text x="18" y="585" fill="#c9d1d9">  lastPayoutCommitment  0x756d6272617061793a67656e6573697300000000000000000000000000000000</text>
    <text x="18" y="606" fill="#c9d1d9">─── connect to the deployed contract ───────────────────────────</text>
    <text x="18" y="626" fill="#c9d1d9">  Loading this contract&apos;s private-state slot — the witness record</text>
    <text x="18" y="647" fill="#c9d1d9">  that never leaves this machine.</text>
    <text x="18" y="668" fill="#c9d1d9">─── commitPayout() ─────────────────────────────────────────────</text>
    <text x="18" y="689" fill="#c9d1d9">  Private inputs (witnesses, held locally and never published):</text>
    <text x="18" y="710" fill="#c9d1d9">    salaryAmount     2,500</text>
    <text x="18" y="731" fill="#c9d1d9">    recipientSecret  &lt;held locally, not printed&gt;</text>
    <text x="18" y="752" fill="#c9d1d9">    paymentSalt      &lt;fresh per run, not printed&gt;</text>
    <text x="18" y="773" fill="#c9d1d9">  Proving and submitting...</text>
    <text x="18" y="794" fill="#3fb950">  ✓ Settled. Tx: 008a63157b228961fd4106ca13109fe4098cdba57e42af1a16f2ea48ee44ab125a</text>
    <text x="18" y="815" fill="#c9d1d9">             Block: 986207</text>
    <text x="18" y="836" fill="#c9d1d9">─── Public ledger AFTER commitPayout() ─────────────────────────</text>
    <text x="18" y="857" fill="#c9d1d9">  payrollFloor          1,000</text>
    <text x="18" y="878" fill="#c9d1d9">  payrollRound          2</text>
    <text x="18" y="899" fill="#c9d1d9">  totalDisbursed        2,500</text>
    <text x="18" y="919" fill="#c9d1d9">  lastPayoutCommitment  0x422d508742f3c04d374fbfaf00986d7e56e2eff1c2061e9690dc78cb70167e1a</text>
    <text x="18" y="940" fill="#c9d1d9">  The aggregate moved by exactly the private salary (2,500),</text>
    <text x="18" y="961" fill="#c9d1d9">  the round advanced by one, and the commitment changed — while neither</text>
    <text x="18" y="982" fill="#c9d1d9">  the amount nor the recipient appears anywhere on the ledger.</text>
    <text x="18" y="1003" fill="#c9d1d9">─── proveAboveFloor() ──────────────────────────────────────────</text>
    <text x="18" y="1024" fill="#c9d1d9">  The compliance primitive: prove the private salary clears the public</text>
    <text x="18" y="1045" fill="#c9d1d9">  floor, publishing nothing at all — no ledger write, no return value.</text>
    <text x="18" y="1066" fill="#c9d1d9">  Proving and submitting...</text>
    <text x="18" y="1087" fill="#3fb950">  ✓ Proven. Tx: 008bd0e1ea6d5daa4a57dddd8543e136fc14a76603996e9b267de2101468726526</text>
    <text x="18" y="1108" fill="#c9d1d9">            Block: 986211</text>
    <text x="18" y="1129" fill="#3fb950">  Ledger unchanged by that transaction: ✓ yes</text>
    <text x="18" y="1150" fill="#c9d1d9">─── Done ───────────────────────────────────────────────────────</text>
    <text x="18" y="1171" fill="#c9d1d9">  Both transactions are finalised on chain, so checking the result needs</text>
    <text x="18" y="1191" fill="#c9d1d9">  neither this script nor its local state:</text>
    <text x="18" y="1212" fill="#c9d1d9">    curl -s -X POST -H &apos;Content-Type: application/json&apos; -d</text>
    <text x="18" y="1233" fill="#c9d1d9"> &apos;{&quot;query&quot;:&quot;query($a:String!){contractAction(address:$a){state}}&quot;,&quot;variables&quot;:{&quot;a&quot;:&quot;8c1765ec101c02e4</text>
    <text x="18" y="1254" fill="#c9d1d9">d4a024c7416185f9d619fcc296aebaf55b436159aed57a5c&quot;}}&apos;</text>
    <text x="18" y="1275" fill="#c9d1d9"> https://indexer.preview.midnight.network/api/v4/graphql</text>
    <text x="18" y="1296" fill="#c9d1d9">  A non-null `state` is this contract. Those bytes are the four public</text>
    <text x="18" y="1317" fill="#c9d1d9">  fields printed above, decoded by managed/counter/contract/index.js —</text>
    <text x="18" y="1338" fill="#c9d1d9">  and nothing else.</text>
    <text x="18" y="1359" fill="#c9d1d9">  Contract: 8c1765ec101c02e4d4a024c7416185f9d619fcc296aebaf55b436159aed57a5c</text>
    <text x="18" y="1380" fill="#c9d1d9">  Network:  preview</text>
  </g>
  <rect x="0.5" y="0.5" width="846" height="1404" rx="10" fill="none" stroke="#30363d"/>
</svg>
